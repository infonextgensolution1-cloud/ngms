name: NGMS Rebuild CI (Next.js, Supabase guard and Docker)

on:
  push:
    branches:
      - rebuild/ngms-cloudflare-first
      - preview/ngms-cloudflare-worker
      - preview/ngms-coolify

permissions:
  contents: read

concurrency:
  group: ngms-rebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, Supabase guard, Next.js and Docker builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ngms-rebuild
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ngms-rebuild/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: TypeScript validation
        run: npm run typecheck
      - name: Ensure rebuild has no Supabase dependencies
        run: |
          if grep -RniE 'supabase|NEXT_PUBLIC_SUPABASE' app components lib package.json package-lock.json next.config.mjs postcss.config.mjs .env.example wrangler.jsonc Dockerfile; then
            echo "Supabase reference found in isolated rebuild source or dependencies."
            exit 1
          fi
          if npm ls @supabase/supabase-js --parseable --all 2>/dev/null | grep -q .; then
            echo "Supabase SDK found in the installed dependency tree."
            exit 1
          fi
      - name: Build Next.js application
        run: npm run build
      - name: Build Coolify-compatible Docker image
        run: docker build --file Dockerfile --tag ngms-rebuild-coolify-smoke .
