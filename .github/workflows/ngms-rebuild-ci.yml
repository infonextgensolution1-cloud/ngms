name: NGMS Cloudflare-first Rebuild CI

on:
  push:
    branches:
      - rebuild/ngms-cloudflare-first
      - preview/ngms-cloudflare-worker

permissions:
  contents: write

concurrency:
  group: ngms-rebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, Supabase guard and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ngms-rebuild
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Commit generated package lock on isolated preview branch
        if: github.ref == 'refs/heads/preview/ngms-cloudflare-worker'
        working-directory: .
        run: |
          if ! git ls-files --error-unmatch ngms-rebuild/package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ngms-rebuild/package-lock.json
            if ! git diff --cached --quiet; then
              git commit -m "build: add generated lockfile for Cloudflare preview"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: TypeScript validation
        run: npm run typecheck
      - name: Ensure rebuild has no Supabase dependencies
        run: |
          if grep -RniE 'supabase|NEXT_PUBLIC_SUPABASE' app components lib package.json package-lock.json next.config.mjs postcss.config.mjs .env.example wrangler.jsonc; then
            echo "Supabase reference found in isolated rebuild source or dependencies."
            exit 1
          fi
          if npm ls @supabase/supabase-js --parseable --all 2>/dev/null | grep -q .; then
            echo "Supabase SDK found in the installed dependency tree."
            exit 1
          fi
      - name: Build Next.js application
        run: npm run build
