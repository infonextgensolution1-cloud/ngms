name: NGMS Production QA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_PROJECT_ID: prj_uZi3UeS4lSYKga9Dxcm7jshzN4B0
  VERCEL_TEAM_ID: team_Tvuw1gszfpVvlqQVCxguGZit
  PRODUCTION_URL: https://www.nextgensolarmaintenance.co.za

jobs:
  production-smoke:
    name: Deploy-aware production smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Wait for matching Vercel production deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN}" || { echo "VERCEL_TOKEN secret is required"; exit 1; }

          for attempt in $(seq 1 18); do
            response=$(curl -fsS --max-time 30 \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_TEAM_ID}&target=production&limit=20")

            deployment=$(echo "$response" | jq -c --arg sha "$COMMIT_SHA" '
              [.deployments[]
                | select(.meta.githubCommitSha == $sha)
                | select(.target == "production")]
              | sort_by(.createdAt)
              | last
            ')

            if [ "$deployment" != "null" ] && [ -n "$deployment" ]; then
              echo "$deployment" > /tmp/deployment.json
              state=$(echo "$deployment" | jq -r '.readyState // .state // "UNKNOWN"')
              url=$(echo "$deployment" | jq -r '.url // ""')
              echo "Found matching deployment: $url ($state)"

              case "$state" in
                READY)
                  exit 0
                  ;;
                ERROR|CANCELED)
                  echo "Vercel deployment failed with state: $state"
                  exit 1
                  ;;
              esac
            else
              echo "Attempt $attempt/18: matching production deployment not visible yet."
            fi

            sleep 20
          done

          echo "Timed out waiting for Vercel production deployment for commit $COMMIT_SHA"
          exit 1

      - name: Verify production homepage
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /tmp/home.html -w "%{http_code}" --max-time 30 "${PRODUCTION_URL}/")
          test "$code" = "200"
          grep -qi "NextGen" /tmp/home.html

      - name: Check critical routes
        run: |
          set -euo pipefail
          routes=(
            "/"
            "/quote"
            "/roi-calculator"
            "/services"
          )

          for route in "${routes[@]}"; do
            echo "Checking ${PRODUCTION_URL}${route}"
            code=$(curl -L -sS -o /dev/null -w "%{http_code}" --max-time 30 "${PRODUCTION_URL}${route}")
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              echo "FAIL: ${route} returned HTTP $code"
              exit 1
            fi
          done

      - name: Check WhatsApp CTA
        run: |
          set -euo pipefail
          curl -L -sS --max-time 30 "${PRODUCTION_URL}/" > /tmp/home.html
          grep -q "wa.me/27631387945" /tmp/home.html

      - name: Report deployment
        if: always()
        run: |
          if [ -f /tmp/deployment.json ]; then
            echo "Deployment:"
            jq '{id, url, readyState, target, createdAt, meta}' /tmp/deployment.json
          fi
          echo "Production QA target: ${PRODUCTION_URL}"
