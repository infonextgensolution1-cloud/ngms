name: NGMS Cloudflare Preview Contract Tests

on:
  pull_request:
    paths:
      - "cloudflare/migrations/**"
      - "cloudflare/workers/ngms-admin-api-preview/**"
      - "cloudflare/workers/ngms-public-intake-preview/**"
      - "ngms-rebuild/components/QuoteRequestForm.tsx"
      - ".github/workflows/ngms-cloudflare-preview-tests.yml"

permissions:
  contents: read

jobs:
  preview-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test admin API attachment and payment contracts
        run: node --test cloudflare/workers/ngms-admin-api-preview/tests/enquiry-attachments.test.mjs
      - name: Test public intake upload and consent contracts
        run: node --test cloudflare/workers/ngms-public-intake-preview/tests/enquiry-attachments.test.mjs
      - name: Test quote request form upload contract
        run: node --test cloudflare/workers/ngms-public-intake-preview/tests/quote-request-form.test.mjs
